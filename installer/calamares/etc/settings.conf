# Raze Linux installer (Calamares) — module sequence.
---
modules-search: [ local, @out@/lib/calamares/modules ]

instances:
- id:       desktop
  module:   packagechooser
  config:   packagechooser-desktop.conf
- id:       profile
  module:   packagechooser
  config:   packagechooser-profile.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - packagechooser@desktop
  - packagechooser@profile
  - users
  - summary
- exec:
  - partition
  - mount
  - raze
  - users
  - umount
- show:
  - finished

branding: raze
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
