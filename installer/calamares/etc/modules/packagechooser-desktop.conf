# Desktop selection. Exactly one is installed. "Raze Desktop (niri)" is shipped on
# the ISO (fast install); the others are downloaded during installation.
---
id: desktop
mode: required
method: legacy
labels:
    step: "Desktop"
default: niri
items:
    - id: niri
      name: "Raze Desktop (niri)"
      description: "<html><b>Default.</b> Keyboard-driven scrollable tiling on Wayland with the Raze session: waybar, fuzzel, foot, mako. Lightest graphical option. Shipped on this ISO, so it installs fastest.</html>"
      screenshot: "images/raze.png"
    - id: hyprland
      name: "Hyprland"
      description: "<html>Dynamic tiling Wayland compositor with animations. Downloaded during installation.</html>"
      screenshot: "images/raze.png"
    - id: dwl
      name: "dwl"
      description: "<html>Minimal dwm-like Wayland compositor. Downloaded during installation.</html>"
      screenshot: "images/raze.png"
    - id: xfce
      name: "Xfce"
      description: "<html>Traditional lightweight desktop (X11). Downloaded during installation.</html>"
      screenshot: "images/raze.png"
    - id: lxqt
      name: "LXQt"
      description: "<html>Lightweight Qt desktop (X11). Downloaded during installation.</html>"
      screenshot: "images/raze.png"
    - id: plasma
      name: "KDE Plasma"
      description: "<html>Full-featured desktop. Heavier than the Raze default. Downloaded during installation.</html>"
      screenshot: "images/raze.png"
    - id: gnome
      name: "GNOME"
      description: "<html>Full-featured desktop. Heavier than the Raze default. Downloaded during installation.</html>"
      screenshot: "images/raze.png"
    - id: dwm
      name: "dwm"
      description: "<html>Suckless dynamic window manager (X11). Downloaded during installation.</html>"
      screenshot: "images/raze.png"
