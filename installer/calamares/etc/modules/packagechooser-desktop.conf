# Desktop selection. Exactly one is installed. "Raze Desktop (Rift)" is shipped on
# the ISO (fast install); the others are downloaded during installation.
---
id: desktop
mode: required
method: legacy
labels:
    step: "Desktop"
default: rift
items:
    - id: rift
      name: "Raze Desktop (Rift)"
      description: "<html><b>Default.</b> Rift, Raze's own scrollable-tiling Wayland compositor, with Rift Shell: panel, launcher, control centre, notifications, lock screen. Runs on any GPU, including without 3D acceleration. Shipped on this ISO, so it installs fastest.</html>"
      screenshot: "images/raze.png"
    - id: niri
      name: "niri"
      description: "<html>Scrollable-tiling Wayland compositor with the waybar/fuzzel/mako session. Needs a hardware-accelerated GPU (falls back to sway otherwise). Downloaded during installation.</html>"
      screenshot: "images/raze.png"
    - id: hyprland
      name: "Hyprland"
      description: "<html>Dynamic tiling Wayland compositor with animations. Downloaded during installation.</html>"
      screenshot: "images/raze.png"
    - id: dwl
      name: "dwl"
      description: "<html>Minimal dwm-like Wayland compositor. Downloaded during installation.</html>"
      screenshot: "images/raze.png"
    - id: xfce
      name: "Xfce"
      description: "<html>Traditional lightweight desktop (X11). Downloaded during installation.</html>"
      screenshot: "images/raze.png"
    - id: lxqt
      name: "LXQt"
      description: "<html>Lightweight Qt desktop (X11). Downloaded during installation.</html>"
      screenshot: "images/raze.png"
    - id: plasma
      name: "KDE Plasma"
      description: "<html>Full-featured desktop. Heavier than the Raze default. Downloaded during installation.</html>"
      screenshot: "images/raze.png"
    - id: gnome
      name: "GNOME"
      description: "<html>Full-featured desktop. Heavier than the Raze default. Downloaded during installation.</html>"
      screenshot: "images/raze.png"
    - id: dwm
      name: "dwm"
      description: "<html>Suckless dynamic window manager (X11). Downloaded during installation.</html>"
      screenshot: "images/raze.png"
