---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: true
requirements:
    requiredStorage: 12
    requiredRam: 2.0
    internetCheckUrl: [ https://cache.nixos.org/ ]
    check:
        - storage
        - ram
        - power
        - internet
        - screen
    # nixos-install builds a few small derivations (initrd, /etc) and downloads
    # anything not already on the ISO, so a network connection is required.
    required:
        - storage
        - ram
        - internet
