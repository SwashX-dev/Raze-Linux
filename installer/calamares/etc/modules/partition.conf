# Partitioning choices: erase disk, install alongside another system (shrinks one of
# its partitions), replace a partition, manual. Nothing is preselected, so a disk
# with another system on it is never erased by accident.
#
# The EFI system partition is mounted at /boot/efi and may be shared with other
# systems (Windows' ESP is often only 100 MB): GRUB keeps kernels on the root
# filesystem and only its EFI binary goes to the ESP. Other systems are added to the
# boot menu by the raze module.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 1GiB
    minimumSize: 300MiB
    label: "RAZE_EFI"
userSwapChoices:
    - none
    - small
# Raze uses zram swap by default; a swap partition is optional.
initialSwapChoice: none
# Encrypted automated partitioning is untested in v1.0.0, so it is not offered.
enableLuksAutomatedPartitioning: false
defaultFileSystemType: "ext4"
availableFileSystemTypes:
    - ext4
    - btrfs
    - xfs
showNotEncryptedBootMessage: false
initialPartitioningChoice: none
# Offer to install alongside / replace when another system is found.
allowManualPartitioning: true
partitionLayout:
    - name: "raze"
      filesystem: "unknown"
      noEncrypt: true
      mountPoint: "/"
      size: 100%
