# Tested in v1.0.0: "Erase disk" on an empty disk with UEFI or BIOS, ext4 root.
# Manual partitioning and installing alongside another OS are offered by Calamares
# but have NOT been validated for this release (see docs/installation/graphical.md).
---
efi:
    mountPoint: "/boot"
    recommendedSize: 1GiB
    minimumSize: 300MiB
    label: "RAZE_EFI"
userSwapChoices:
    - none
    - small
# Raze uses zram swap by default; a swap partition is optional.
initialSwapChoice: none
# Encrypted automated partitioning is untested in v1.0.0, so it is not offered.
enableLuksAutomatedPartitioning: false
defaultFileSystemType: "ext4"
availableFileSystemTypes:
    - ext4
    - btrfs
    - xfs
showNotEncryptedBootMessage: false
initialPartitioningChoice: erase
partitionLayout:
    - name: "raze"
      filesystem: "unknown"
      noEncrypt: true
      mountPoint: "/"
      size: 100%
