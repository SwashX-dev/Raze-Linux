[package]
name = "r6"
description = "r6: a small, fast, Rust init and service supervision suite inspired by s6"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "r6-init"
path = "src/bin/r6-init.rs"

[[bin]]
name = "r6-supervise"
path = "src/bin/r6-supervise.rs"

[[bin]]
name = "r6"
path = "src/bin/r6.rs"

[[bin]]
name = "r6-log"
path = "src/bin/r6-log.rs"

[[bin]]
name = "r6-activate"
path = "src/bin/r6-activate.rs"

[[bin]]
name = "r6-user"
path = "src/bin/r6-user.rs"

[[bin]]
name = "r6-config"
path = "src/bin/r6-config.rs"

[[bin]]
name = "r6-tmpfiles"
path = "src/bin/r6-tmpfiles.rs"


[[bin]]
name = "r6-syslogd"
path = "src/bin/r6-syslogd.rs"
[[bin]]
name = "r6-import"
path = "src/bin/r6-import.rs"

[[bin]]
name = "r6-timers"
path = "src/bin/r6-timers.rs"
