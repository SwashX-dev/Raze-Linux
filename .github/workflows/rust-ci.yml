name: rust-ci
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Format
        run: |
          nix develop -c cargo fmt --all --check
          nix develop -c cargo fmt --manifest-path rift/Cargo.toml --check
          nix develop -c cargo fmt --manifest-path rift-shell/Cargo.toml --check
      - name: Clippy
        run: |
          nix develop -c cargo clippy --workspace --all-targets -- -D warnings
          nix develop -c cargo clippy --manifest-path rift/Cargo.toml --all-targets -- -D warnings
          nix develop -c cargo clippy --manifest-path rift-shell/Cargo.toml --all-targets -- -D warnings
      - name: Test (host)
        run: |
          nix develop -c cargo test --workspace
          nix develop -c cargo test --manifest-path rift/Cargo.toml
          nix develop -c cargo test --manifest-path rift-shell/Cargo.toml
      - name: Build and test packages (Nix sandbox)
        run: nix build -L .#r6 .#rix .#rift .#rift-shell
