# Raze Linux software-rendering session (sway + wlroots pixman renderer).
# Started by raze-session when no hardware-accelerated GPU is available (niri
# requires one). Keybindings mirror the default Raze niri session.

set $mod Mod4
font pango:Inter 10

default_border pixel 2
default_floating_border pixel 2
gaps inner 8
client.focused          #dc2626 #dc2626 #ffffff #dc2626 #dc2626
client.focused_inactive #3f3f46 #3f3f46 #d4d4d8 #3f3f46 #3f3f46
client.unfocused        #27272a #27272a #a1a1aa #27272a #27272a

output * bg @WALLPAPER@ fill

input type:touchpad {
    tap enabled
    natural_scroll enabled
}

bindsym $mod+Return exec foot
bindsym $mod+d exec fuzzel
bindsym $mod+e exec pcmanfm
bindsym $mod+Escape exec raze-power-menu
bindsym $mod+Mod1+l exec swaylock -f -c 0f0f10
bindsym $mod+q kill
bindsym $mod+Shift+e exit
bindsym $mod+f fullscreen toggle
bindsym $mod+v floating toggle
bindsym $mod+r layout toggle split tabbed

bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down
bindsym $mod+h focus left
bindsym $mod+l focus right
bindsym $mod+k focus up
bindsym $mod+j focus down
bindsym $mod+Ctrl+Left move left
bindsym $mod+Ctrl+Right move right
bindsym $mod+Ctrl+Up move up
bindsym $mod+Ctrl+Down move down

bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5

bindsym XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym Print exec grim ~/Pictures/raze-$(date +%Y%m%d-%H%M%S).png

exec waybar
exec mako
exec lxqt-policykit-agent
exec raze-session-autostart
exec raze-session-ready
